aid: miriel
name: Miriel
description: >-
  Miriel is the context engine and platform for AI-native development. It gives
  AI apps and agents the context they need in real time through a simple API:
  developers connect a data source with the learn operation and retrieve relevant
  context with the query operation, backed by LLM, vector, and knowledge-graph
  retrieval. Every interaction is encrypted and permissions are managed at the
  token level (per-user grants and policies). Built by a team with backgrounds
  across Google, Tesla, Facebook, and Posit, Miriel handles intelligent indexing
  and retrieval tailored to each source, plus Labs projects (Nora, Floodlight)
  and tools like Autodev and NexusBuild. Backed by Foundry Group.
